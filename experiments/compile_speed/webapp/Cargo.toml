[workspace]
resolver = "3"
members = ["app", "deps_dylib"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
